<!DOCTYPE html>
<html lang="de">
<head>

<title>Bestellung bestätigt — Nike Ava X Mesh</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>

body{font-family:'Archivo',sans-serif;background:#f5f5f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:16px;padding:48px 40px;max-width:480px;width:100%;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.08)}

.back{display:inline-block;margin-top:28px;padding:14px 32px;background:#0a0a0a;color:#fff;border-radius:50px;font-weight:700;font-size:13px;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}
.back:hover{background:#333}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Bestellung bestätigt!</h1>
  <p>Vielen Dank für deine Bestellung des Nike Ava X Mesh.<br>
  Du erhältst in Kürze eine Bestätigungs-E-Mail mit deiner Tracking-Nummer.</p>
